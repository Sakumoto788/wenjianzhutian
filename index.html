<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>诸天纪元 · 宣传页</title>

    <style>
        /* ===== 全局重置 ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            background: #0a0806;
        }

        /* ===== 视频背景 — 调亮 ===== */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            filter: brightness(1.3) saturate(1.3) contrast(1.1);
        }

        /* ===== 遮罩层 — 通透 ===== */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 45%,
                    rgba(10, 6, 4, 0.05) 0%,
                    rgba(8, 5, 3, 0.12) 25%,
                    rgba(6, 4, 2, 0.25) 50%,
                    rgba(4, 2, 1, 0.50) 75%,
                    rgba(2, 1, 0, 0.80) 100%);
            pointer-events: none;
        }

        /* ===== 高光层 ===== */
        .highlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 40%,
                    rgba(255, 220, 180, 0.04) 0%,
                    transparent 60%);
            mix-blend-mode: overlay;
        }

        /* ==========================================================
           主内容排版
           ========================================================== */

        .content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 92%;
            max-width: 1200px;
            pointer-events: none;
            margin-top: -2vh;
        }

        .divider-top {
            width: clamp(60px, 8vw, 120px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.15), transparent);
            margin-bottom: clamp(0.8rem, 2vh, 2rem);
            animation: dividerFade 3s ease-out 1.5s both;
        }

        /* ===== 主标题 — 缩小 + 华文行楷 ===== */
        .title {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(4rem, 14vw, 8rem);
            letter-spacing: 0.22em;
            line-height: 1.05;
            pointer-events: auto;
            display: block;
            text-align: center;

            background: linear-gradient(135deg,
                    #ff2d00 0%,
                    #ff6a00 20%,
                    #ffb800 45%,
                    #ffd700 60%,
                    #ff8c00 80%,
                    #ff2d00 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 5s ease infinite;

            text-shadow:
                0 0 20px rgba(255, 45, 0, 0.3),
                0 0 60px rgba(255, 184, 0, 0.2),
                0 4px 20px rgba(0, 0, 0, 0.6),
                0 8px 60px rgba(0, 0, 0, 0.5);

            filter: drop-shadow(0 0 40px rgba(255, 107, 0, 0.10));

            transform-origin: center;
            will-change: transform, background-position;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .divider-bottom {
            width: clamp(40px, 5vw, 80px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 120, 0.12), transparent);
            margin-top: clamp(0.6rem, 1.2vh, 1.2rem);
            margin-bottom: clamp(0.8rem, 1.8vh, 1.8rem);
            animation: dividerFade 3s ease-out 2s both;
        }

        @keyframes dividerFade {
            0% {
                opacity: 0;
                transform: scaleX(0.3);
            }
            100% {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        /* ===== 副标题 ===== */
        .subtitle {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(1rem, 1.8vw, 1.6rem);
            letter-spacing: 0.5em;
            color: rgba(255, 220, 160, 0.70);
            text-shadow:
                0 2px 30px rgba(0, 0, 0, 0.8),
                0 0 60px rgba(0, 0, 0, 0.3);
            opacity: 1;
            pointer-events: auto;
            text-align: center;
        }

        /* ===== 按钮组 ===== */
        .btn-group {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(0.8rem, 1.5vw, 1.5rem);
            margin-top: clamp(1.2rem, 2.5vh, 2.5rem);
            pointer-events: auto;
        }

        .btn-common {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(0.9rem, 1.4vw, 1.3rem);
            letter-spacing: 0.3em;
            padding: 0.6em 2.2em;
            border: 1px solid rgba(255, 215, 120, 0.3);
            border-radius: 50px;
            background: rgba(255, 215, 120, 0.05);
            color: rgba(255, 215, 120, 0.7);
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .btn-common:hover {
            background: rgba(255, 215, 120, 0.15);
            border-color: rgba(255, 215, 120, 0.6);
            color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 120, 0.1);
            transform: scale(1.04);
        }

        /* ===== 作者 — 右下角落款 ===== */
        .author-wrapper {
            position: fixed;
            bottom: clamp(2rem, 4vh, 4rem);
            right: clamp(1.5rem, 4vw, 4rem);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            pointer-events: auto;
            opacity: 1;
            animation: none;
        }

        .author-seal {
            width: clamp(32px, 3.5vw, 48px);
            height: clamp(32px, 3.5vw, 48px);
            border: 2px solid rgba(200, 80, 60, 0.35);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(0.5rem, 0.7vw, 0.7rem);
            color: rgba(200, 80, 60, 0.35);
            letter-spacing: 0.05em;
            line-height: 1.2;
            text-align: center;
            transform: rotate(-6deg);
            transition: all 0.4s ease;
            background: rgba(200, 80, 60, 0.04);
        }

        .author-seal:hover {
            border-color: rgba(200, 80, 60, 0.6);
            color: rgba(200, 80, 60, 0.6);
            background: rgba(200, 80, 60, 0.08);
            transform: rotate(0deg);
        }

        .author-name {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            letter-spacing: 0.5em;
            background: linear-gradient(90deg,
                    rgba(255, 215, 120, 0.30),
                    rgba(255, 180, 80, 0.50),
                    rgba(255, 215, 120, 0.30));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
            opacity: 0.7;
        }

        .author-sub {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(0.4rem, 0.6vw, 0.55rem);
            color: rgba(255, 215, 120, 0.08);
            letter-spacing: 0.3em;
            margin-top: 0.2rem;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
        }

        /* ===== 底部版权 ===== */
        .footer {
            position: fixed;
            bottom: clamp(1.2rem, 2vh, 2.4rem);
            left: 0;
            width: 100%;
            z-index: 2;
            text-align: center;
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(0.5rem, 0.7vw, 0.7rem);
            letter-spacing: 0.5em;
            color: rgba(255, 215, 120, 0.6);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            pointer-events: none;
        }

        /* ==========================================================
           ★ 通用模态框基座 ★
           ========================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            animation: modalFadeIn 0.4s ease;
            pointer-events: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-inner {
            position: relative;
            width: 92%;
            max-width: 1400px;
            max-height: 90vh;
            padding: 2rem 1rem;
            border-radius: 20px;
            background: rgba(10, 8, 6, 0.85);
            /* 背景图已移除 */
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 120, 0.15);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 2.5rem;
            font-weight: 300;
            color: rgba(255, 215, 120, 0.6);
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ffd700;
            transform: rotate(90deg);
        }

        /* ==========================================================
           ★ 人物志模态框 ★
           ========================================================== */
        .char-modal-inner {
            /* 背景图已移除 */
        }

        .char-list-view {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .modal-title {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(1.8rem, 3vw, 3rem);
            letter-spacing: 0.4em;
            color: rgba(255, 215, 120, 0.7);
            text-shadow: 0 0 30px rgba(255, 215, 120, 0.1);
            margin-bottom: 1.5rem;
        }

        .gallery-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .char-gallery {
            display: flex;
            flex-wrap: nowrap;
            gap: 1.2rem;
            padding: 0.5rem 0.5rem 2rem 0.5rem;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            justify-content: flex-start;
            align-items: center;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            cursor: grab;
            scrollbar-width: thick;
            scrollbar-color: rgba(255, 215, 120, 0.5) rgba(255, 255, 255, 0.08);
        }

        .char-gallery:active {
            cursor: grabbing;
        }

        .char-gallery::-webkit-scrollbar {
            height: 14px;
            background: transparent;
        }

        .char-gallery::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin: 0 10px;
        }

        .char-gallery::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 120, 0.5);
            border-radius: 10px;
            border: 2px solid rgba(0, 0, 0, 0.3);
            min-height: 30px;
        }

        .char-gallery::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 120, 0.8);
        }

        .char-gallery::-webkit-scrollbar-corner {
            background: transparent;
        }

        .scroll-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-55%);
            z-index: 5;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 120, 0.2);
            color: rgba(255, 215, 120, 0.7);
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            line-height: 1;
        }

        .scroll-arrow:hover {
            background: rgba(255, 215, 120, 0.2);
            border-color: rgba(255, 215, 120, 0.5);
            color: #ffd700;
        }

        .scroll-arrow-left {
            left: -6px;
        }
        .scroll-arrow-right {
            right: -6px;
        }

        .char-item {
            flex: 0 0 auto;
            width: clamp(90px, 14vw, 200px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 215, 120, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            background: #1a1410;
            cursor: pointer;
        }

        .char-item:hover {
            transform: scale(1.05) translateY(-6px);
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 215, 120, 0.3);
        }

        .char-item img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #1a1410;
        }

        .char-item .char-name {
            text-align: center;
            padding: 0.3rem 0;
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            color: rgba(255, 215, 120, 0.7);
            letter-spacing: 0.1em;
            background: rgba(0, 0, 0, 0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .char-detail-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 0.5rem;
            animation: detailFadeIn 0.3s ease;
            position: relative;
        }

        .char-detail-view.active {
            display: flex;
        }

        @keyframes detailFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .detail-back {
            position: absolute;
            top: 10px;
            left: 20px;
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-size: 2rem;
            color: rgba(255, 215, 120, 0.5);
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            padding: 0 0.6rem;
            border-radius: 30px;
            line-height: 1.4;
            border: 1px solid rgba(255, 215, 120, 0.1);
        }

        .detail-back:hover {
            color: #ffd700;
            border-color: rgba(255, 215, 120, 0.4);
            background: rgba(0, 0, 0, 0.5);
        }

        .detail-image-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 215, 120, 0.15);
            background: #1a1410;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .detail-image-wrapper:hover {
            transform: scale(1.01);
        }

        .detail-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ==========================================================
           ★ 剧情CG欣赏模态框 ★
           ========================================================== */
        .cg-modal-inner {
            max-width: 1000px;
            /* 背景图已移除 */
        }

        .cg-title {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-weight: 400;
            font-size: clamp(1.6rem, 2.8vw, 2.8rem);
            letter-spacing: 0.4em;
            color: rgba(255, 215, 120, 0.8);
            text-shadow: 0 0 30px rgba(255, 215, 120, 0.15);
            margin-bottom: 1rem;
        }

        .cg-video-wrapper {
            width: 100%;
            max-width: 900px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 215, 120, 0.15);
            background: #000;
            position: relative;
            cursor: pointer;
        }

        .cg-video-wrapper video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .cg-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(60px, 10vw, 100px);
            height: clamp(60px, 10vw, 100px);
            border-radius: 50%;
            background: rgba(255, 215, 120, 0.15);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 215, 120, 0.3);
            color: rgba(255, 215, 120, 0.8);
            font-size: clamp(2rem, 4vw, 4rem);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            pointer-events: none;
            opacity: 0.8;
        }

        .cg-video-wrapper:hover .cg-play-btn {
            opacity: 1;
            background: rgba(255, 215, 120, 0.25);
            border-color: rgba(255, 215, 120, 0.6);
        }

        .cg-video-wrapper .cg-play-btn.hidden {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .cg-hint {
            font-family: '华文行楷', 'STXingkai', 'KaiTi', cursive;
            font-size: clamp(0.7rem, 1vw, 0.9rem);
            color: rgba(255, 215, 120, 0.25);
            letter-spacing: 0.2em;
            margin-top: 0.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* ==========================================================
           响应式
           ========================================================== */
        @media (max-width: 768px) {
            .title {
                letter-spacing: 0.12em;
            }
            .subtitle {
                letter-spacing: 0.4em;
            }
            .author-wrapper {
                bottom: clamp(1.2rem, 2.5vh, 2rem);
                right: clamp(0.8rem, 2vw, 1.5rem);
            }
            .author-seal {
                width: 28px;
                height: 28px;
                font-size: 0.5rem;
            }
            .char-item {
                width: clamp(70px, 16vw, 140px);
            }
            .modal-close {
                font-size: 2rem;
                top: 6px;
                right: 14px;
            }
            .footer {
                font-size: clamp(0.4rem, 0.6vw, 0.6rem);
            }
            .detail-back {
                font-size: 1.6rem;
                top: 6px;
                left: 12px;
            }
            .scroll-arrow {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
            .scroll-arrow-left {
                left: -4px;
            }
            .scroll-arrow-right {
                right: -4px;
            }
            .char-gallery::-webkit-scrollbar {
                height: 10px;
            }
            .btn-group {
                gap: 0.6rem;
            }
            .btn-common {
                font-size: clamp(0.75rem, 1.2vw, 0.9rem);
                padding: 0.4em 1.6em;
            }
        }

        @media (max-width: 480px) {
            .title {
                letter-spacing: 0.06em;
                font-size: clamp(3rem, 12vw, 4.5rem);
            }
            .subtitle {
                letter-spacing: 0.25em;
                font-size: clamp(0.8rem, 1.2vw, 1rem);
                margin-top: 0.2rem;
            }
            .author-wrapper {
                bottom: 0.8rem;
                right: 0.8rem;
            }
            .author-seal {
                width: 24px;
                height: 24px;
                font-size: 0.4rem;
                border-width: 1px;
            }
            .author-name {
                font-size: 0.65rem;
                letter-spacing: 0.3em;
            }
            .author-sub {
                display: none;
            }
            .divider-top,
            .divider-bottom {
                display: none;
            }
            .footer {
                display: block;
                font-size: 0.5rem;
                bottom: 0.8rem;
                color: rgba(255, 215, 120, 0.5);
            }
            .content {
                margin-top: -1vh;
            }
            .char-item {
                width: clamp(60px, 20vw, 100px);
            }
            .modal-title {
                font-size: 1.2rem;
            }
            .detail-back {
                font-size: 1.4rem;
                top: 4px;
                left: 8px;
                padding: 0 0.4rem;
            }
            .scroll-arrow {
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
            }
            .scroll-arrow-left {
                left: -2px;
            }
            .scroll-arrow-right {
                right: -2px;
            }
            .char-gallery::-webkit-scrollbar {
                height: 8px;
            }
            .char-gallery {
                gap: 0.8rem;
                padding: 0.3rem 0.3rem 1.5rem 0.3rem;
            }
            .btn-group {
                gap: 0.5rem;
                flex-direction: column;
                align-items: center;
            }
            .btn-common {
                font-size: 0.7rem;
                padding: 0.4em 1.4em;
                width: 80%;
                text-align: center;
            }
            .cg-title {
                font-size: 1.2rem;
            }
            .cg-play-btn {
                width: 50px;
                height: 50px;
                font-size: 1.6rem;
            }
            .cg-hint {
                font-size: 0.6rem;
            }
        }

        /* ===== 视频降级 ===== */
        .no-video .overlay {
            background: radial-gradient(ellipse at center,
                    #1a100a 0%,
                    #0a0604 80%,
                    #030201 100%);
        }

        /* ===== 悬停彩蛋 ===== */
        @media (hover: hover) {
            .title:hover {
                animation-play-state: paused;
                filter: drop-shadow(0 0 60px rgba(255, 45, 0, 0.3)) drop-shadow(0 0 120px rgba(255, 184, 0, 0.2));
                transition: filter 0.6s ease;
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================================
    视频背景
    ========================================================== -->
    <video id="bgVideo" autoplay muted loop playsinline preload="auto">
        <source src="http://tih8qixrg.hn-bkt.clouddn.com/7%E6%9C%8820%E6%97%A5%20%281%29.mp4" type="video/mp4" />
        您的浏览器不支持 HTML5 视频。
    </video>

    <!-- 高光层 -->
    <div class="highlight"></div>

    <!-- 遮罩层 -->
    <div class="overlay"></div>

    <!-- ==========================================================
    主内容
    ========================================================== -->
    <div class="content">
        <div class="divider-top"></div>
        <h1 class="title">诸天纪元</h1>
        <div class="divider-bottom"></div>
        <p class="subtitle">—— 一部横跨诸天的群像史诗 ——</p>

        <!-- ★ 按钮组：人物志 + 剧情CG欣赏 ★ -->
        <div class="btn-group">
            <button class="btn-common" id="openCharModal">✦ 人物志 ✦</button>
            <button class="btn-common" id="openCgModal">✦ 剧情CG欣赏 ✦</button>
        </div>
    </div>

    <!-- ==========================================================
    作者 — 右下角落款
    ========================================================== -->
    <div class="author-wrapper">
        <div class="author-seal">老九<br />门印</div>
        <div class="author-name">老 九 门</div>
        <div class="author-sub">· 玄 天 之 笔 ·</div>
    </div>

    <!-- 底部版权 -->
    <div class="footer">✦ 万 界 之 上 · 纪 元 之 始 ✦</div>

    <!-- ==========================================================
    ★ 人物志模态框 ★
    ========================================================== -->
    <div class="modal-overlay" id="charModal">
        <div class="modal-inner char-modal-inner">
            <span class="modal-close" id="closeCharModal">✕</span>
            <div class="char-list-view" id="charListView">
                <div class="modal-title">✦ 人物志 ✦</div>
                <div class="gallery-wrapper">
                    <div class="scroll-arrow scroll-arrow-left" id="scrollLeft">‹</div>
                    <div class="char-gallery" id="charGallery"></div>
                    <div class="scroll-arrow scroll-arrow-right" id="scrollRight">›</div>
                </div>
            </div>
            <div class="char-detail-view" id="charDetailView">
                <div class="detail-back" id="detailBack">‹</div>
                <div class="detail-image-wrapper" id="detailImageWrapper">
                    <img id="detailImage" src="" alt="角色大图" />
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================================
    ★ 剧情CG欣赏模态框 ★
    ========================================================== -->
    <div class="modal-overlay" id="cgModal">
        <div class="modal-inner cg-modal-inner">
            <span class="modal-close" id="closeCgModal">✕</span>
            <div class="cg-title">✦ 祖碑大战 ✦</div>
            <div class="cg-video-wrapper" id="cgVideoWrapper">
                <video id="cgVideo" preload="metadata">
                    <!-- ★★★ CG视频链接已替换 ★★★ -->
                    <source src="http://tih8qixrg.hn-bkt.clouddn.com/%E7%A5%96%E7%A2%91%E5%A4%A7%E6%88%98.mp4" type="video/mp4" />
                    您的浏览器不支持视频播放。
                </video>
                <div class="cg-play-btn" id="cgPlayBtn">▶</div>
            </div>
            <div class="cg-hint">✦ 点击视频播放 · 再次点击暂停 ✦</div>
        </div>
    </div>

    <!-- ==========================================================
    JavaScript 控制
    ========================================================== -->
    <script>
        (function() {
            'use strict';

            // ---------- 获取视频元素 ----------
            const bgVideo = document.getElementById('bgVideo');
            const cgVideo = document.getElementById('cgVideo');
            const body = document.body;

            // ---------- 背景视频控制 ----------
            function tryPlayBgVideo() {
                if (!bgVideo) return;
                bgVideo.play().catch(function(err) {
                    console.log('背景视频自动播放被阻止，等待用户交互...');
                    document.addEventListener('click', function playOnClick() {
                        bgVideo.play().catch(function(e) {});
                        document.removeEventListener('click', playOnClick);
                    }, { once: true });
                });
            }

            function enableBgAudio() {
                document.addEventListener('click', function enable() {
                    if (bgVideo) {
                        bgVideo.muted = false;
                        if (bgVideo.paused) {
                            bgVideo.play().catch(function() {});
                        }
                    }
                    document.removeEventListener('click', enable);
                }, { once: true });
            }

            bgVideo.addEventListener('error', function() {
                body.classList.add('no-video');
                console.log('背景视频加载失败，使用纯色背景降级。');
            });

            setTimeout(function() {
                if (bgVideo.readyState === 0) {
                    body.classList.add('no-video');
                }
            }, 4000);

            if (document.readyState === 'complete') {
                tryPlayBgVideo();
                enableBgAudio();
            } else {
                window.addEventListener('load', function() {
                    tryPlayBgVideo();
                    enableBgAudio();
                });
            }

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden && bgVideo && bgVideo.paused) {
                    bgVideo.play().catch(function() {});
                }
            });

            document.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            // ---------- ★ 核心功能：CG视频与背景视频联动 ★ ----------
            function pauseBgVideo() {
                if (bgVideo && !bgVideo.paused) {
                    bgVideo.pause();
                    console.log('背景视频已暂停（CG开始播放）');
                }
            }

            function resumeBgVideo() {
                if (bgVideo && bgVideo.paused) {
                    bgVideo.play().catch(function(e) {
                        console.log('恢复背景视频失败:', e);
                    });
                    console.log('背景视频已恢复（CG暂停/结束）');
                }
            }

            cgVideo.addEventListener('play', function() {
                pauseBgVideo();
            });

            cgVideo.addEventListener('pause', function() {
                if (!cgVideo.ended) {
                    resumeBgVideo();
                }
            });

            cgVideo.addEventListener('ended', function() {
                resumeBgVideo();
                updateCgPlayBtn();
            });

            cgVideo.addEventListener('error', function() {
                console.log('CG视频加载失败，请检查链接');
            });

            // ---------- 人物志数据 ----------
            const characters = [{
                name: '幸格',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/01-xingge.webp'
            }, {
                name: '史迪',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/02-shidi.webp'
            }, {
                name: '晨曦',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/03-chenxi.webp'
            }, {
                name: '生枫',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/06-shengfeng.webp'
            }, {
                name: '阿怪',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/04-aguai.webp'
            }, {
                name: '雪月',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/05-xueyue.webp'
            }, {
                name: '青禾',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/07-qinghe.webp'
            }, {
                name: '青石村村长',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/08-village-chief.webp'
            }, {
                name: '周守山',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/09-zhou-shoushan.webp'
            }, {
                name: '顾寒舟',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/10-gu-hanzhou.webp'
            }, {
                name: '韩照',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/11-han-zhao.webp'
            }, {
                name: '记户吏',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/13-household-clerk.webp'
            }, {
                name: '陆沉',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/14-lu-chen.webp'
            }, {
                name: '苏闻星',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/15-su-wenxing.webp'
            }, {
                name: '无名引路人',
                detailImage: 'https://raw.githubusercontent.com/Sakumoto788/zhutian/c6184508797203de8299159da9df0565f6ca8d71/16-nameless-guide.webp'
            }];

            const avatarLinks = [
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/xeeg.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/shidi.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/chenxi.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/sf.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/aguai.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/xueyue.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/qinghe.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/cunzhang.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/zhoushoushan.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/guhanzhou.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/hanzhao.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/jishili.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/luchen.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/suwenxing.png',
                'https://raw.githubusercontent.com/Sakumoto788/zhutian/25ea0062a57cea2a92511331e26aa3485393a4e2/wuming.png'
            ];

            // ---------- 渲染人物志 ----------
            const gallery = document.getElementById('charGallery');
            gallery.innerHTML = '';
            characters.forEach((char, index) => {
                const item = document.createElement('div');
                item.className = 'char-item';
                item.setAttribute('data-index', index);
                const avatarUrl = avatarLinks[index] || '#';
                item.innerHTML = `
                    <img src="${avatarUrl}" alt="${char.name}" loading="lazy" onerror="this.src='#'" />
                    <div class="char-name">${char.name}</div>
                `;
                item.addEventListener('click', function() {
                    openCharDetail(index);
                });
                gallery.appendChild(item);
            });

            // ---------- 人物志导航箭头 ----------
            const scrollLeftBtn = document.getElementById('scrollLeft');
            const scrollRightBtn = document.getElementById('scrollRight');

            function scrollGallery(direction) {
                const scrollAmount = gallery.clientWidth * 0.7;
                const targetScroll = gallery.scrollLeft + direction * scrollAmount;
                gallery.scrollTo({ left: targetScroll, behavior: 'smooth' });
            }

            scrollLeftBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                scrollGallery(-1);
            });
            scrollRightBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                scrollGallery(1);
            });

            function updateArrows() {
                const scrollLeft = gallery.scrollLeft;
                const maxScroll = gallery.scrollWidth - gallery.clientWidth;
                scrollLeftBtn.style.opacity = scrollLeft > 10 ? '1' : '0.2';
                scrollRightBtn.style.opacity = scrollLeft < maxScroll - 10 ? '1' : '0.2';
                if (maxScroll <= 0) {
                    scrollLeftBtn.style.display = 'none';
                    scrollRightBtn.style.display = 'none';
                } else {
                    scrollLeftBtn.style.display = 'flex';
                    scrollRightBtn.style.display = 'flex';
                }
            }
            gallery.addEventListener('scroll', updateArrows);
            let resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(updateArrows, 100);
            });

            // ---------- 人物志模态框控制 ----------
            const charModal = document.getElementById('charModal');
            const openCharBtn = document.getElementById('openCharModal');
            const closeCharBtn = document.getElementById('closeCharModal');
            const charListView = document.getElementById('charListView');
            const charDetailView = document.getElementById('charDetailView');
            const detailImage = document.getElementById('detailImage');
            const detailBack = document.getElementById('detailBack');
            const detailImageWrapper = document.getElementById('detailImageWrapper');

            function openCharModalFn() {
                charModal.classList.add('active');
                charListView.style.display = 'flex';
                charDetailView.classList.remove('active');
                charDetailView.style.display = 'none';
                setTimeout(updateArrows, 50);
            }

            function closeCharModalFn() {
                charModal.classList.remove('active');
            }

            function openCharDetail(index) {
                const char = characters[index];
                if (!char) return;
                detailImage.src = char.detailImage || '#';
                charListView.style.display = 'none';
                charDetailView.style.display = 'flex';
                charDetailView.classList.remove('active');
                void charDetailView.offsetWidth;
                charDetailView.classList.add('active');
            }

            function goBackToList() {
                charDetailView.classList.remove('active');
                charDetailView.style.display = 'none';
                charListView.style.display = 'flex';
                setTimeout(updateArrows, 50);
            }

            detailBack.addEventListener('click', goBackToList);
            detailImageWrapper.addEventListener('click', goBackToList);
            openCharBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                openCharModalFn();
            });
            closeCharBtn.addEventListener('click', closeCharModalFn);
            charModal.addEventListener('click', function(e) {
                if (e.target === charModal) closeCharModalFn();
            });

            // ---------- ★ 剧情CG视频控制 ★ ----------
            const cgModal = document.getElementById('cgModal');
            const openCgBtn = document.getElementById('openCgModal');
            const closeCgBtn = document.getElementById('closeCgModal');
            const cgPlayBtn = document.getElementById('cgPlayBtn');
            const cgVideoWrapper = document.getElementById('cgVideoWrapper');

            function updateCgPlayBtn() {
                if (cgVideo.paused) {
                    cgPlayBtn.textContent = '▶';
                    cgPlayBtn.classList.remove('hidden');
                } else {
                    cgPlayBtn.textContent = '❚❚';
                    cgPlayBtn.classList.add('hidden');
                }
            }

            function toggleCgPlay() {
                if (cgVideo.paused) {
                    cgVideo.play().catch(function(e) {
                        console.log('CG视频播放被阻止:', e);
                    });
                } else {
                    cgVideo.pause();
                }
                updateCgPlayBtn();
            }

            cgVideoWrapper.addEventListener('click', function(e) {
                if (e.target.closest('.modal-close')) return;
                toggleCgPlay();
            });

            cgVideo.addEventListener('play', function() {
                updateCgPlayBtn();
            });
            cgVideo.addEventListener('pause', function() {
                updateCgPlayBtn();
            });
            cgVideo.addEventListener('ended', function() {
                updateCgPlayBtn();
            });

            function openCgModalFn() {
                cgModal.classList.add('active');
                if (cgVideo.ended) {
                    cgVideo.currentTime = 0;
                    updateCgPlayBtn();
                }
            }

            function closeCgModalFn() {
                cgModal.classList.remove('active');
                if (cgVideo && !cgVideo.paused) {
                    cgVideo.pause();
                }
                if (bgVideo && bgVideo.paused) {
                    bgVideo.play().catch(function() {});
                }
            }

            openCgBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                openCgModalFn();
            });

            closeCgBtn.addEventListener('click', closeCgModalFn);

            cgModal.addEventListener('click', function(e) {
                if (e.target === cgModal) closeCgModalFn();
            });

            // ESC 键关闭
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (charModal.classList.contains('active')) {
                        if (charDetailView.classList.contains('active')) {
                            goBackToList();
                        } else {
                            closeCharModalFn();
                        }
                    } else if (cgModal.classList.contains('active')) {
                        closeCgModalFn();
                    }
                }
            });

            // 键盘左右键翻页（人物志列表可见时）
            document.addEventListener('keydown', function(e) {
                if (!charModal.classList.contains('active')) return;
                if (charDetailView.classList.contains('active')) return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    scrollGallery(-1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    scrollGallery(1);
                }
            });

            console.log('✦ 诸天纪元 · 人物志 + 剧情CG欣赏（联动暂停）加载完成 ✦');
            console.log('★ 作者：老九门 ★');

        })();
    </script>

</body>
